<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d5c4a" />
  <title>Pallet Operations — Prototipo por etapas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">PO</div><div><strong>Pallet Operations</strong><span>Prototipo funcional por etapas · v0.17</span></div></div>
      <nav aria-label="Módulos principales">
        <button class="nav-btn active" data-view="inicio"><span>⌂</span> Inicio</button>
        <button class="nav-btn" data-view="ordenes"><span>＋</span> Órdenes</button>
        <button class="nav-btn" data-view="madera"><span>▦</span> Inventario de madera</button>
        <button class="nav-btn" data-view="conversion"><span>⇄</span> Conversión de madera</button>
        <button class="nav-btn" data-view="produccion"><span>✂</span> Producción / Corte</button>
        <button class="nav-btn" data-view="fabricacion"><span>⚒</span> Fabricación de pallets</button>
        <button class="nav-btn" data-view="terminados"><span>▣</span> Inventario de pallets</button>
        <button class="nav-btn" data-view="carga"><span>▰</span> Carga y despacho</button>
        <button class="nav-btn" data-view="reportes"><span>▥</span> Reportes</button>
        <button class="nav-btn" data-view="resumen"><span>≡</span> Resumen</button>
        <button class="nav-btn" data-view="historial"><span>↻</span> Historial</button>
        <button class="nav-btn" data-view="configuracion"><span>⚙</span> Configuración</button>
      </nav>
      <div class="sidebar-footer">Motor integrado: <b>LoadMaster AI v5.58</b><br><span>Datos conectados por etapas · preparación automática de carga.</span></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
        <div><h1 id="viewTitle">Centro de control</h1><p id="viewSubtitle"></p></div>
        <div class="top-actions"><label class="quick-theme" title="Apariencia"><span>◐</span><select id="themeQuick" aria-label="Tema"><option value="light">Claro</option><option value="dark">Oscuro</option><option value="system">Automático</option></select></label><span class="badge online">● Demo activa</span><button class="icon-btn" id="resetDemo" title="Restablecer demo">↺</button></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" class="dialog"><form method="dialog"><div class="dialog-head"><div><h2 id="dialogTitle"></h2><p id="dialogSubtitle"></p></div><div class="dialog-head-actions"><label class="quick-theme dialog-theme" title="Apariencia"><span>◐ Tema</span><select id="dialogThemeQuick" aria-label="Tema en pantalla completa"><option value="light">Claro</option><option value="dark">Oscuro</option><option value="system">Automático</option></select></label><button class="close-btn" value="cancel">×</button></div></div><div id="dialogBody"></div></form></dialog>
  <script src="app.js"></script>
</body>
</html>
